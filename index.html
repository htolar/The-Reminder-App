<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Reusable Studio Engine</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main class="studio" aria-labelledby="studio-title">
			<header class="studio__header">
				<p class="eyebrow">Reusable Studio Engine / Anatomy Lab</p>
				<h1 id="studio-title">Explore the hand</h1>
			</header>

			<section class="viewer" aria-label="Rotatable 3D hand anatomy viewer">
				<canvas id="studio-canvas" aria-label="Rotatable 3D hand anatomy model"></canvas>
				<ul class="anatomy-key" aria-label="Anatomy layers">
					<li><span class="swatch swatch--skin"></span>Skin</li>
					<li><span class="swatch swatch--muscle"></span>Muscle</li>
					<li><span class="swatch swatch--ligament"></span>Ligaments</li>
					<li><span class="swatch swatch--bone"></span>Bones</li>
					<li><span class="swatch swatch--vein"></span>Veins</li>
					<li><span class="swatch swatch--tendon"></span>Tendons</li>
					<li><span class="swatch swatch--nerve"></span>Nerves</li>
					<li><span class="swatch swatch--artery"></span>Arteries</li>
					<li><span class="swatch swatch--fascia"></span>Fascia</li>
				</ul>
			</section>

			<label class="reveal-control" for="reveal-slider">
				<span>Reveal</span>
				<input id="reveal-slider" type="range" min="0" max="1" step="0.001" value="0" />
			</label>
		</main>
		<script type="module" src="./main.js"></script>
	</body>
</html>
