<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick check-in</title>
  <style>
    html { color-scheme: light; }
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; color: #111; background: #fff; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #444; line-height: 1.4; }
    .actions { display: flex; gap: 10px; }
    button { font: inherit; padding: 10px 16px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #111; cursor: pointer; flex: 1; }
    #no { background: #000; color: #fff; border-color: #000; }
  </style>
</head>
<body>
  <h1>Are you being productive?</h1>
  <p id="msg"></p>
  <div class="actions">
    <button id="yes" type="button">Yes, I'm working</button>
    <button id="no" type="button">No, close it</button>
  </div>
  <script src="checkin.js"></script>
</body>
</html>
